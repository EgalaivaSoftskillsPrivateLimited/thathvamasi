version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: thathvamasi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thc_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-thathvamasi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thathvamasi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thc_user} -d ${POSTGRES_DB:-thathvamasi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thathvamasi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-thc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thc_secure_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-thathvamasi_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-thc_user}:${POSTGRES_PASSWORD:-thc_secure_password_2026}@postgres:5432/${POSTGRES_DB:-thathvamasi_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-thathvamasi_super_secret_jwt_signing_key_prod_2026}
      - CORS_ORIGINS=["https://${DOMAIN:-thathvamasi.com}", "http://${DOMAIN:-thathvamasi.com}", "http://localhost"]
    volumes:
      - backend_uploads:/app/app/static/uploads
    networks:
      - thathvamasi-net
    expose:
      - "8000"

  # ----------------------------------------------------------------------------
  # Frontend Static & Nginx Reverse Proxy Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_ENDPOINT=/api
        - VITE_SITE_URL=https://${DOMAIN:-thathvamasi.com}
    container_name: thathvamasi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-80}:80"
    networks:
      - thathvamasi-net

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  thathvamasi-net:
    driver: bridge
