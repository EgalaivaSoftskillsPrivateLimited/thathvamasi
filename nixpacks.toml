# Nixpacks configuration for Thathvamasi Workspace
[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = ["npm --prefix frontend install --include=dev --include=optional"]

[phases.build]
cmds = ["npm --prefix frontend run build:prod"]

[start]
cmd = "npm --prefix frontend run start"
