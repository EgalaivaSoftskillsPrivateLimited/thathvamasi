name: Frontend Production CI/CD

on:
  push:
    branches: [ main, client, staging ]
  pull_request:
    branches: [ main, client ]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build & Validate Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Production Frontend
        run: npm --prefix frontend run build:prod

      - name: Validate Production Build Artifacts
        run: |
          echo "Verifying essential distribution files..."
          test -f frontend/dist/index.html || { echo "Missing index.html"; exit 1; }
          test -f frontend/dist/404.html || { echo "Missing 404.html"; exit 1; }
          test -f frontend/dist/sitemap.xml || { echo "Missing sitemap.xml"; exit 1; }
          test -f frontend/dist/site.webmanifest || { echo "Missing site.webmanifest"; exit 1; }
          test -d frontend/dist/assets || { echo "Missing assets directory"; exit 1; }
          test -d frontend/dist/services || { echo "Missing services directory"; exit 1; }
          test -d frontend/dist/business || { echo "Missing business directory"; exit 1; }
          test -d frontend/dist/industries || { echo "Missing industries directory"; exit 1; }
          echo "All production distribution artifacts validated successfully!"

      - name: Archive Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thathvamasi-frontend-dist
          path: frontend/dist/
          retention-days: 14
